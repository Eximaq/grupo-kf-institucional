name: Probe licensed video sources
on:
  push:
    paths: [.github/workflows/clip-probe.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify Mixkit licensed free reel URLs
        shell: bash
        run: |
          set -e
          for slug in             mixkit-aerial-view-of-a-park-on-the-coast-of-a-city-50189             mixkit-aerial-view-of-a-beautiful-seashore-10332             mixkit-coast-of-a-big-city-in-a-view-from-the-heights-50188             mixkit-dynamic-drone-tour-through-a-beach-44382             mixkit-aerial-panoramic-view-of-a-sunny-coastline-50178; do
            for size in large medium small; do
              url="https://assets.mixkit.co/videos/preview/$slug-$size.mp4"
              result=$(curl -s -L -o /dev/null --max-time 12 -w '%{http_code} %{size_download} %{content_type}' -r 0-1024 "$url" || true)
              echo "$slug $size: $result"
            done
          done
