name: Probe licensed video sources
on:
  push:
    paths: [.github/workflows/clip-probe.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Resolve stock media
        shell: bash
        run: |
          set +e
          python -m pip -q install yt-dlp
          for id in 27668238 34328931 33404367; do
            echo "==== MEDIA $id ===="
            for tag in "hd_1920_1080_30fps" "uhd_3840_2160_30fps" "uhd_3840_2160_25fps" "uhd_3840_2160_2997fps" "hd_1920_1080_24fps"; do
              url="https://videos.pexels.com/video-files/$id/$id-$tag.mp4"
              echo "test $tag $(curl -L -s -o /dev/null --max-time 8 -w '%{http_code}' -r 0-2047 "$url")"
            done
            page="https://www.pexels.com/video/aerial-video-$id/"
            curl -L -s -o /tmp/pexels_page.html --max-time 12 -w "pexels page response %{http_code} bytes %{size_download}\n" "$page"
            yt-dlp --list-formats --no-warnings --socket-timeout 12 "https://www.pexels.com/video/$id/" 2>&1 | tail -12
          done
